<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Quali 3D (demo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a0b0d; overflow: hidden; font-family: Archivo, system-ui, sans-serif; color: #f2f2ee; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: fixed; pointer-events: none; }
      #timing { top: 20px; right: 20px; background: rgba(10,11,13,0.82); padding: 10px 16px 12px; min-width: 190px; }
      #timing .k { font-size: 12px; letter-spacing: 0.08em; color: #9aa0a6; text-transform: uppercase; }
      #timing .t { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
      #speed { bottom: 22px; left: 50%; transform: translateX(-50%); background: rgba(10,11,13,0.82); padding: 8px 22px; display: flex; align-items: baseline; gap: 18px; }
      #speed .g { font-size: 40px; font-weight: 800; }
      #speed .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
      #speed .u { font-size: 12px; color: #9aa0a6; }
      #brand { top: 20px; left: 20px; background: rgba(10,11,13,0.82); padding: 8px 14px; }
      #brand b { color: #ff6a13; font-size: 20px; letter-spacing: 0.04em; }
      #brand span { display: block; font-size: 12px; color: #c7c9cc; }
      #cam { bottom: 26px; right: 20px; background: rgba(10,11,13,0.7); padding: 6px 12px; font-size: 13px; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="brand" class="hud"><b>LAPDLE</b><span>Daily Quali · Spa-Francorchamps · 3D</span></div>
    <div id="timing" class="hud"><div class="k">Lap</div><div class="t" id="lt">0:00.000</div></div>
    <div id="speed" class="hud"><span class="g" id="gear">N</span><span class="v" id="kmh">0</span><span class="u">KM/H</span></div>
    <div id="cam" class="hud">Camera: Chase</div>
    <script type="module" src="/src/dev/lap3d.ts"></script>
  </body>
</html>
