<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circuit 3D (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0b0d; overflow: hidden; font: 13px system-ui, sans-serif; color: #ddd; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #ui button { background: #1c1e22cc; color: #ddd; border: 1px solid #333; padding: 6px 10px; cursor: pointer; }
      #ui input[type=range] { flex: 1; min-width: 200px; }
      #stats { position: fixed; bottom: 8px; left: 8px; opacity: 0.75; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="stats"></div>
    <script type="module" src="/src/dev/circuit3d.ts"></script>
  </body>
</html>
